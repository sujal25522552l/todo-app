version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5006:5006"
    environment:
      - NODE_ENV=production
      - PORT=5006
    # Add database service if needed
    # depends_on:
    #   - database

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:5006